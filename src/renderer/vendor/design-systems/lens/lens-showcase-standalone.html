      this.value = this.target; this.velocity = 0;
    }
    return this.value;
  }
  snap(value = this.target) { this.value = this.target = value; this.velocity = 0; }
  get moving() { return Math.abs(this.velocity) > .025 || Math.abs(this.target - this.value) > .005; }
}

/** Stretch along motion, compress across it, preserving area apart from lift. */
function jellyMatrix(stretch, angle, lift = 1) {
  const along = 1 + clamp(stretch, -.20, .34), across = 1 / along;
  const c = Math.cos(angle), s = Math.sin(angle);
  return [
    (along * c * c + across * s * s) * lift,
    (along - across) * c * s * lift,
    (along - across) * c * s * lift,
    (along * s * s + across * c * c) * lift

}

function boundDrag(x, y, box, viewport, padding = 16) {
  return {
    x: clamp(x, padding - box.left, viewport.width - padding - box.right),
    y: clamp(y, padding - box.top, viewport.height - padding - box.bottom)

}

/** A toggle stretches along its rail without ever crossing the rail's inset. */
function togglePose(position, travel, size, pressure=0, stretch=0) {
  const scaleX=1+clamp(pressure*.10+stretch,0,Math.min(.18,travel/Math.max(size,1)));
  const extra=(scaleX-1)*size/2;
  return {x:clamp(position,extra,Math.max(extra,travel-extra)),scaleX,scaleY:1/scaleX};
}


const opticalRecords = new WeakMap();
const opticClamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));

function opticRange(value, min, max, step = 1) {
  if (![value, min, max, step].every(Number.isFinite) || max <= min || step <= 0) throw new TypeError('Invalid optical control range');
  return Number(opticClamp(min + Math.round((value - min) / step) * step, min, max).toFixed(8));
}

function opticXY(value, min, max, step) {
  return {x: opticRange(value.x, min, max, step), y: opticRange(value.y, min, max, step)};
}

function opticPoint(clientX, clientY, rect, inset = 0) {
  return {x: opticClamp((clientX - rect.left - inset) / Math.max(1, rect.width - inset * 2)), y: 1 - opticClamp((clientY - rect.top - inset) / Math.max(1, rect.height - inset * 2))};
}

/** Attraction follows the nearest enabled centre, even between the wells. */
function opticDropTarget(point, targets) {
  let nearest=null,distance=Infinity;
  for(const target of targets){if(target.disabled)continue;const next=(point.x-target.x)**2+(point.y-target.y)**2;if(next<distance){nearest=target.value;distance=next;}}
  return nearest;
}

function opticColor(name = 'green') {
  if (!['green', 'gold'].includes(name)) throw new TypeError('Completion color must be green or gold');
  const hex = tokens.optics[name];
  return [1, 3, 5].map(offset => parseInt(hex.slice(offset, offset + 2), 16) / 255);
}

/** Stateless sampling keeps interruption, hidden tabs and reduced motion deterministic. */
function sampleOpticalTransition(record, now, reduced = false) {
  const duration = record.duration || 0;
  const position = reduced || !duration ? 1 : opticClamp((now - record.start) / duration);
  const eased = 1 - (1 - position) ** 3;
  const result = {...record.to};
  for (const key of ['fill', 'complete', 'selected', 'hover']) {
    const end = record.to[key] || 0, start = record.from[key] || 0;
    const t = key === 'complete' && end > start ? opticClamp((position - .12) / .88) : eased;
    result[key] = t === 1 ? end : start + (end - start) * t;
  }
  if (typeof record.to.opacity === 'number') result.opacity = position === 1 ? record.to.opacity : (record.from.opacity ?? record.to.opacity) + (record.to.opacity - (record.from.opacity ?? record.to.opacity)) * eased;
  const elapsed = now - record.flowStart;
  result.flow = !reduced && record.flowStart !== null && elapsed >= 0 && elapsed < tokens.optics.flowDuration ? elapsed / tokens.optics.flowDuration : -1;
  return result;
}

function readOpticalState(element, now = performance.now(), reduced = false) {
  const record = opticalRecords.get(element);
  return record ? sampleOpticalTransition(record, now, reduced && !record.to.forceMotion) : null;
}

function setOpticalState(element, patch, {animate = true, pulse = false, duration: requestedDuration} = {}) {
  const now = performance.now(), prior = opticalRecords.get(element);
  const reduced = !(patch.forceMotion ?? prior?.to.forceMotion) && typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = prior ? sampleOpticalTransition(prior, now, reduced) : {fill: 0, complete: 0, selected: 0, hover: 0};
  const to = {...(prior?.to || from), ...patch};
  const duration = !animate || reduced ? 0 : requestedDuration ?? (pulse ? tokens.optics.flowDuration : tokens.optics.settleDuration);
  const sameSelection = to.selected === prior?.to.selected && to.complete === prior?.to.complete;
  const record = {from, to, start: now, duration, flowStart: animate && !reduced ? pulse ? now : sameSelection ? prior?.flowStart ?? null : null : null};
  opticalRecords.set(element, record);
  element.dispatchEvent(new CustomEvent('lg:optics', {bubbles: true, detail: {duration:Math.max(duration,animate&&!reduced&&pulse?tokens.optics.flowDuration:0)}}));
  return record;
}

function clearOpticalState(element) { opticalRecords.delete(element); }

function opticalSelection(element, selected, color = 'green', animate = true) {
  const wasSelected = (opticalRecords.get(element)?.to.selected || 0) > .5;
  element.style.setProperty('--lg-optical-color', tokens.optics[color] || tokens.optics.green);
  setOpticalState(element, {selected: selected ? 1 : 0, color: opticColor(color)}, {animate, pulse: selected && !wasSelected});
  const beam = element.querySelector('.lg-optic-beam');
  if (beam) {
    beam.getAnimations().forEach(animation => animation.cancel());
    if (selected && !wasSelected && animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) beam.animate([{transform: 'rotate(-100deg)', opacity: 0}, {opacity: 1, offset: .12}, {transform: 'rotate(260deg)', opacity: 0}], {duration: tokens.optics.flowDuration, easing: 'ease-out'});
  }
}


/** The original lens spring solver, driven by a drop target instead of free drag. */
class OpticalDragMotion {
  constructor({intensity = .7, reduced = false} = {}) {
    this.intensity = intensity; this.reduced = reduced; this.held = false; this.angle = 0;
    for (const key of ['x', 'y', 'press', 'stretch', 'bendX', 'bendY']) this[key] = new Spring();
    this.optical = {bend: [0, 0], pressure: 0, energy: 0};
  }

  target(x, y, {snap = false} = {}) {
    this.x.target = x; this.y.target = y;
    if (snap) {
      this.x.snap(); this.y.snap(); this.press.snap(this.held ? 1 : 0);
      this.stretch.snap(0); this.bendX.snap(0); this.bendY.snap(0);
    }
  }

  hold(held) { this.held = held; this.press.target = held ? 1 : 0; }

  step(dt) {
    const amount = this.intensity * (this.reduced ? .65 : 1);
    const damping = this.reduced ? 34 : this.held ? 22 : 17;
    this.x.step(dt, 260, damping); this.y.step(dt, 260, damping);
    this.press.step(dt, 310, this.reduced ? 32 : 18);
    const speed = Math.hypot(this.x.velocity, this.y.velocity);
    if (speed > 16) this.angle = Math.atan2(this.y.velocity, this.x.velocity);
    this.stretch.target = Math.min(speed / 2400, .25) * amount;
    this.stretch.step(dt, 230, this.reduced ? 30 : 15);
    this.bendX.target = clamp((this.x.target - this.x.value) * .12, -11, 11) * amount;
    this.bendY.target = clamp((this.y.target - this.y.value) * .12, -11, 11) * amount;
    this.bendX.step(dt, 190, this.reduced ? 28 : 14);
    this.bendY.step(dt, 190, this.reduced ? 28 : 14);
    const pressure = clamp(this.press.value, 0, 1.16);
    this.optical.bend[0] = this.bendX.value; this.optical.bend[1] = this.bendY.value;
    this.optical.pressure = pressure;
    this.optical.energy = Math.abs(this.stretch.value) + Math.hypot(this.bendX.value, this.bendY.value) * .015;
    return {x: this.x.value, y: this.y.value, matrix: jellyMatrix(this.stretch.value, this.angle, 1 + pressure * amount * .035)};
  }

  get moving() { return ['x', 'y', 'press', 'stretch', 'bendX', 'bendY'].some(key => this[key].moving); }
}

/** Shared lens component body. The stage supplies one renderer and spring controller. */
function createLensSurface({tag = 'div', className = '', kind = 'panel', motion = 'none'} = {}) {
  const element = document.createElement(tag);
  element.className = `lg-surface ${className}`.trim();
  element.dataset.glass = kind;
  element.dataset.lgLens = kind;
  if (motion !== 'none') element.dataset.lgDrag = motion;
  return {element, destroy() {}};
}

/** A shared budget includes ordinary glass, charts, records and same-origin frames. */
class ContextBudget {
  constructor(limit=6){this.limit=limit;this.clients=new Set();}
  add(client){
    const entry={...client,active:false};this.clients.add(entry);
    entry.destroy=()=>{this.clients.delete(entry);if(entry.active){entry.active=false;entry.suspend();}};
    return entry;
  }
  update(){
    const ranked=[...this.clients].map(entry=>({entry,rank:entry.priority()}))
      .filter(({rank})=>Number.isFinite(rank)).sort((a,b)=>b.rank-a.rank);
    const wanted=new Set(ranked.slice(0,this.limit).map(({entry})=>entry));
    // Release every departing lease before acquiring any new one.
    for(const entry of this.clients)if(entry.active&&!wanted.has(entry)){entry.active=false;entry.suspend();}
    for(const entry of wanted)if(!entry.active){entry.active=true;entry.activate();}
  }
}

function viewportPriority(host){
  const doc=host.ownerDocument,win=doc.defaultView;
  if(!host.isConnected||doc.hidden||!host.getClientRects().length)return -Infinity;
  const style=win.getComputedStyle(host);if(style.visibility==='hidden')return -Infinity;
  let rect=host.getBoundingClientRect(),left=Math.max(0,rect.left),top=Math.max(0,rect.top),right=Math.min(win.innerWidth,rect.right),bottom=Math.min(win.innerHeight,rect.bottom);
  if(right<=left||bottom<=top)return -Infinity;
  // A srcdoc lab must not retain GPU slots when its parent view is hidden.
  for(let current=win;current.frameElement;current=current.parent){
    const frame=current.frameElement,r=frame.getBoundingClientRect();
    if(!frame.getClientRects().length||current.parent.document.hidden||r.bottom<=0||r.top>=current.parent.innerHeight||r.right<=0||r.left>=current.parent.innerWidth)return -Infinity;
  }
  return (right-left)*(bottom-top)/(Math.max(1,rect.width*rect.height))-
    Math.abs((top+bottom)/2-win.innerHeight/2)/Math.max(1,win.innerHeight)*.01;
}

function observeGPU(host,activate,suspend){
  const win=host.ownerDocument.defaultView;
  let owner=win;
  try{while(owner.parent!==owner&&owner.parent.document)owner=owner.parent;}catch{/* Cross-origin callers keep their own budget. */}
  const key=Symbol.for('lens.viewport-gpu-budget.v1');
  if(!owner[key]){
    const budget=new ContextBudget(6),documents=new Map();let frame=0;
    const schedule=()=>{if(!frame)frame=owner.requestAnimationFrame(()=>{frame=0;budget.update();});};
    owner[key]={budget,documents,schedule};
  }
  const shared=owner[key],doc=host.ownerDocument;
  if(!shared.documents.has(doc)){
    const abort=new win.AbortController(),signal=abort.signal;
    doc.addEventListener('scroll',shared.schedule,{capture:true,passive:true,signal});
    doc.addEventListener('visibilitychange',shared.schedule,{signal});
    win.addEventListener('resize',shared.schedule,{passive:true,signal});
    shared.documents.set(doc,{count:0,abort});
  }
  const connection=shared.documents.get(doc);connection.count++;
  const lease=shared.budget.add({priority:()=>viewportPriority(host),activate,suspend});
  const resize=new win.ResizeObserver(shared.schedule);resize.observe(host);
  const intersection=new win.IntersectionObserver(shared.schedule);intersection.observe(host);
  let destroyed=false;
  const destroy=()=>{
    if(destroyed)return;destroyed=true;resize.disconnect();intersection.disconnect();lease.destroy();
    win.removeEventListener('pagehide',pagehide);
    if(!--connection.count){connection.abort.abort();shared.documents.delete(doc);}
    shared.schedule();
  };
  const pagehide=event=>{if(!event.persisted)destroy();};win.addEventListener('pagehide',pagehide);
  shared.schedule();
  return {get active(){return lease.active;},destroy,update:shared.schedule};
}

/**
 * GlassRenderer — dependency-free WebGL2 material compositor.
 * Semantic DOM supplies the geometry. The scene lives in a sampled framebuffer;
 * each rounded lens refracts that actual image, then contributes to later lenses.
 * It does not capture arbitrary DOM behind it (see README).

const VERTEX = `#version 300 es
in vec2 aPosition;
uniform vec2 uResolution;
uniform vec4 uQuad;
out vec2 vPixel;
void main(){
  vPixel = uQuad.xy + (aPosition * .5 + .5) * uQuad.zw;
  gl_Position = vec4(vPixel / uResolution * 2. - 1., 0., 1.);
}`;

const BACKGROUND = `#version 300 es
precision highp float;
in vec2 vPixel;
out vec4 outColor;
uniform sampler2D uArtwork;
uniform vec2 uResolution;
uniform float uTime;
uniform float uAnimate;
uniform float uBrightness;
uniform float uGrid;
void main(){
  vec2 uv = vPixel / uResolution;
  float movement = uAnimate * (1. - uGrid);
  uv.x += sin(uv.y * 5.8 + uTime * .21) * .012 * movement;
  uv.y += sin(uv.x * 5. + uTime * .16) * .010 * movement;
  vec3 c = texture(uArtwork, clamp(uv, .001, .999)).rgb;
  c *= uBrightness;
  outColor = vec4(c, 1.);
}`;

const COPY = `#version 300 es
precision highp float;
in vec2 vPixel;
out vec4 outColor;
uniform sampler2D uScene;
uniform vec2 uResolution;
void main(){ outColor = texture(uScene, vPixel / uResolution); }
`;

const LENS = `#version 300 es
precision highp float;
in vec2 vPixel;
out vec4 outColor;
uniform sampler2D uScene;
uniform vec2 uResolution;
uniform vec4 uBox;
uniform vec2 uLocalSize;
uniform mat2 uInverse;
uniform vec2 uBend;
uniform float uPressure;
uniform float uEnergy;
uniform vec2 uPointer;
uniform float uRadius;
uniform float uScale;
uniform float uRefraction;
uniform float uBlur;
uniform float uDispersion;
uniform float uTint;
uniform float uDark;
uniform float uCompare;
uniform float uHover;
uniform vec4 uAccent;
uniform float uOpacity;
uniform float uOpticKind;
uniform vec4 uOptic;
uniform vec3 uEmission;
uniform float uFlow;
uniform float uZoom;
uniform float uWaveTime;

float roundedBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x,q.y),0.) + length(max(q,0.)) - r;
}
float surfaceDistance(vec2 world){
  vec2 p=uInverse*world;
  vec2 halfSize=uLocalSize*.5;
  vec2 q=clamp(p/max(halfSize,vec2(1.)),vec2(-1.3),vec2(1.3));
  // A dragged surface bows between its corners, then settles with the spring.
  // This same shape drives silhouette, refraction normals and specular light.
  p -= uBend * vec2(1.-q.y*q.y,1.-q.x*q.x)*.7;

}
vec3 sampleScene(vec2 px){

vec3 blurred(vec2 px, float blur){
  vec3 c = sampleScene(px) * .24;
  c += sampleScene(px + vec2(blur,0.)) * .12;
  c += sampleScene(px - vec2(blur,0.)) * .12;
  c += sampleScene(px + vec2(0.,blur)) * .12;

  float opposite = pow(max(dot(n2,-light),0.),7.)*.52;
  float fresnel = .04+.96*pow(1.-normal.z,5.);
  float outline = 1.-smoothstep(.12*uScale,1.1*uScale,abs(d+.65*uScale));
  float edgeLight = (directional+opposite)*pow(edge,4.);

  float caustic=exp(-pow((d+3.*uScale)/(1.65*uScale),2.));
  c += caustic*opposite*.038*(1.-uCompare);

  float glint = exp(-length((vPixel-uPointer)/vec2(180.,150.)/uScale)*2.);
  c += glint*.024*(.4+uHover)*(1.-uCompare);
  vec2 face=p/max(b,vec2(1.));
  float broadReflection=exp(-pow((face.x*.55+face.y*.8-light.x*.4)*1.6,2.));
  vec3 ambient=sampleScene(center+vec2(-b.x*.6,b.y*.55));

    c += vec3(.3,.76,1.)*uOptic.w*(pow(edge,3.)*.35+.04);

  float travel=fract(phase-uFlow*1.15+1.);

  float innerEdge=exp(-pow((d+4.*uScale)/(3.*uScale),2.));
  if(progressGlass){
    float fiberY=local.y/uScale-sin(opticalUV.x*16.-uWaveTime*2.8)*1.5-sin(opticalUV.x*31.-uWaveTime*4.1)*.35;
    float fiber=exp(-pow(fiberY/1.0,2.))*.24+exp(-pow((fiberY-5.)/.65,2.))*.11;

  return () => {

    active = false;
    if (--entry.count === 0) {

menu\" hidden>\u003cbutton role=\"menuitem\" id=\"menu-reset\">\u003csvg class=\"icon\">\u003cuse href=\"#i-reset\"/>\u003c/svg>\u003cspan data-i18n=\"resetDemo\">重置示例\u003c/span>\u003c/button>\u003cbutton role=\"menuitem\" id=\"menu-lens\">\u003csvg class=\"icon\">\u003cuse href=\"#i-eye\"/>\u003c/svg>\u003cspan data-i18n=\"inspectLens\">检查折射\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\r\n              \u003cdiv class=\"connection-row\">\u003cbutton class=\"connection active\" id=\"wifi\" aria-pressed=\"true\">\u003cspan class=\"connection-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-wifi\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>\u003cspan data-i18n=\"wifi\">无线网络\u003c/span>\u003c/strong>\u003csmall id=\"wifi-status\">已连接\u003c/small>\u003c/span>\u003c/button>\u003cbutton class=\"connection active\" id=\"bluetooth\" aria-pressed=\"true\">\u003cspan class=\"connection-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-bluetooth\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>\u003cspan data-i18n=\"bluetooth\">蓝牙\u003c/span>\u003c/strong>\u003csmall id=\"bluetooth-status\">已开启\u003c/small>\u003c/span>\u003c/button>\u003c/div>\r\n              \u003cdiv class=\"demo-slider-row\">\u003csvg class=\"icon\">\u003cuse href=\"#i-sun\"/>\u003c/svg>\u003clabel class=\"sr-only\" for=\"brightness\">\u003cspan data-i18n=\"brightness\">场景亮度\u003c/span>\u003c/label>\u003cdiv class=\"demo-range-wrap\">\u003cinput id=\"brightness\" class=\"demo-range\" type=\"range\" min=\"30\" max=\"100\" value=\"82\">\u003cspan class=\"demo-slider-thumb glass lg-surface\" data-glass=\"slider-thumb\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003coutput id=\"brightness-value\" for=\"brightness\">82%\u003c/output>\u003c/div>\r\n              \u003cdiv class=\"focus-row\">\u003cspan class=\"focus-label\">\u003csvg class=\"icon\">\u003cuse href=\"#i-moon\"/>\u003c/svg>\u003cspan>\u003cspan data-i18n=\"focus\">专注模式\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"focus-state\" id=\"focus-state\" aria-hidden=\"true\">关\u003c/span>\u003cbutton class=\"switch glass-switch\" id=\"focus-switch\" role=\"switch\" aria-checked=\"false\" aria-label=\"专注模式\" data-i18n-aria=\"focus\">\u003cspan class=\"switch-track glass lg-surface\" data-glass=\"switch-track\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"switch-thumb glass lg-surface\" data-glass=\"thumb\" aria-hidden=\"true\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>\u003c/span>\u003c/button>\u003c/div>\r\n              \u003cdiv class=\"panel-divider\">\u003c/div>\r\n              \u003cdiv class=\"panel-bottom\">\u003cspan id=\"panel-message\" aria-live=\"polite\">留一点空间，给自己。\u003c/span>\u003cbutton class=\"glass round-button lg-surface\" data-glass=\"small\" id=\"favorite\" aria-label=\"收藏此刻\" aria-pressed=\"false\">\u003csvg class=\"icon\">\u003cuse href=\"#i-heart\"/>\u003c/svg>\u003c/button>\u003c/div>\r\n            \u003c/section>\r\n            \u003cnav class=\"glass demo-dock lg-surface\" data-glass=\"dock\" aria-label=\"示例视图\" data-i18n-aria=\"dockAria\">\u003cspan class=\"dock-indicator glass lg-surface\" data-glass=\"selected\" aria-hidden=\"true\">\u003c/span>\u003cbutton class=\"dock-button\" data-dock=\"overview\" aria-label=\"总览\" data-i18n-aria=\"overview\" aria-current=\"page\">\u003csvg class=\"icon\">\u003cuse href=\"#i-grid\"/>\u003c/svg>\u003cspan>\u003cspan data-i18n=\"overview\">总览\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"dock-button\" data-dock=\"material\" aria-label=\"通透材质\" data-i18n-aria=\"clearAria\">\u003csvg class=\"icon\">\u003cuse href=\"#i-layers\"/>\u003c/svg>\u003cspan>\u003cspan data-i18n=\"material\">材质\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"dock-button\" data-dock=\"favorites\" aria-label=\"收藏状态\" data-i18n-aria=\"savedAria\">\u003csvg class=\"icon\">\u003cuse href=\"#i-heart\"/>\u003c/svg>\u003cspan>\u003cspan data-i18n=\"favorites\">收藏\u003c/span>\u003c/span>\u003c/button> 03csection class=\"specimen\" data-component=\"步进 数值 时长 分钟 stepper duration time minutes\">\u003ch3>\u003cspan data-i18n=\"stepper\">步进控件\u003c/span>\u003c/h3>\u003cdiv class=\"stepper glass lg-surface\" data-glass=\"stepper\">\u003cbutton id=\"duration-minus\" aria-label=\"减少五分钟\" data-i18n-aria=\"lessAria\">\u003csvg class=\"icon\">\u003cuse href=\"#i-minus\"/>\u003c/svg>\u003c/button>\u003coutput id=\"duration-value\" aria-live=\"polite\">25\u003cspan> 分钟\u003c/span>\u003c/output>\u003cbutton id=\"duration-plus\" aria-label=\"增加五分钟\" data-i18n-aria=\"moreTimeAria\">\u003csvg class=\"icon\">\u003cuse href=\"#i-plus\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/section>\r\n              \u003csection class=\"specimen specimen-wide\" data-component=\"通知 提醒 卡片 notification reminder card\">\u003ch3>\u003cspan data-i18n=\"notification\">通知卡片\u003c/span>\u003c/h3>\u003cdiv class=\"notification-card glass lg-surface\" data-glass=\"notification\" id=\"notification-card\">\u003cspan class=\"notification-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-bell\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cstrong id=\"notification-title\">给灵感一点空间\u003c/strong>\u003cp id=\"notification-text\">留出 25 分钟，专注眼前。\u003c/p>\u003cspan class=\"notification-meta\">\u003cspan data-i18n=\"reminder\">专注提醒 · 示例\u003c/span>\u003c/span>\u003c/div>\u003cbutton class=\"notification-close\" id=\"notification-close\" aria-label=\"收起通知\" data-i18n-aria=\"closeAria\">\u003csvg class=\"icon\">\u003cuse href=\"#i-close\"/>\u003c/svg>\u003c/button>\u003c/div>\u003cbutton class=\"restore-notification glass lg-surface\" data-glass=\"button\" id=\"restore-notification\" hidden>\u003csvg class=\"icon\">\u003cuse href=\"#i-bell\"/>\u003c/svg>\u003cspan data-i18n=\"restore\">重新显示通知\u003c/span>\u003c/button>\u003c/section>\r\n              \u003csection class=\"specimen specimen-wide\" data-component=\"操作 按钮 图标 收藏 action button icon like favorite\">\u003ch3>\u003cspan data-i18n=\"actions\">操作按钮\u003c/span>\u003c 3cspan data-i18n=\"refraction\">折射强度\u003c/span>\u003c/label>\u003coutput for=\"refraction\" id=\"refraction-value\">90\u003cspan>%\u003c/span>\u003c/output>\u003cinput id=\"refraction\" type=\"range\" min=\"0\" max=\"100\" value=\"90\">\u003c/div>\r\n          \u003cdiv class=\"parameter\">\u003clabel for=\"blur\">\u003cspan data-i18n=\"blur\">雾化程度\u003c/span>\u003c/label>\u003coutput for=\"blur\" id=\"blur-value\">24\u003cspan>%\u003c/span>\u003c/output>\u003cinput id=\"blur\" type=\"range\" min=\"0\" max=\"100\" value=\"24\">\u003c/div>\r\n          \u003cdiv class=\"parameter\">\u003clabel for=\"dispersion\">\u003cspan data-i18n=\"dispersion\">边缘色散\u003c/span>\u003c/label>\u003coutput for=\"dispersion\" id=\"dispersion-value\">65\u003cspan>%\u003c/span>\u003c/output>\u003cinput id=\"dispersion\" type=\"range\" min=\"0\" max=\"100\" value=\"65\">\u003c/div>\r\n          \u003cdiv class=\"parameter\">\u003clabel for=\"elasticity\">\u003cspan data-i18n=\"elasticity\">流动弹性\u003c/span>\u003c/label>\u003coutput for=\"elasticity\" id=\"elasticity-value\">70\u003cspan>%\u003c/span>\u003c/output>\u003cinput id=\"elasticity\" type=\"range\" min=\"0\" max=\"100\" value=\"70\">\u003c/div>\r\n        \u003c/div>\r\n        \u003cfieldset class=\"setting-group scene-group\">\u003clegend>\u003cspan data-i18n=\"sceneLegend\">玻璃背后的世界\u003c/span>\u003c/legend>\u003cdiv class=\"scene-options\">\u003cbutton data-scene=\"aurora\" class=\"scene-swatch aurora\" aria-label=\"流光背景\" data-i18n-aria=\"auroraAria\" aria-pressed=\"true\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>\u003c/button>\u003cbutton data-scene=\"sunset\" class=\"scene-swatch sunset\" aria-label=\"日落背景\" data-i18n-aria=\"sunsetAria\" aria-pressed=\"false\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>\u003c/button>\u003cbutton data-scene=\"ocean\" class=\"scene-swatch ocean\" aria-label=\"深海背景\" data-i18n-aria=\"oceanAria\" aria-pressed=\"false\">\u003csvg class=\"icon\">\u003 an>\u003c/span>\u003c/p>\u003c/div>\r\n        \u003cbutton class=\"copy-button\" id=\"copy-button\">\u003csvg class=\"icon\">\u003cuse href=\"#i-code\"/>\u003c/svg>\u003cspan>\u003cspan data-i18n=\"copy\">复制材质参数\u003c/span>\u003c/span>\u003c/button>\r\n      \u003c/aside>\r\n    \u003c/div>\r\n    \u003csection id=\"optical-demo\">\u003c/section>\r\n    \u003cfooter class=\"site-footer\">\u003ca class=\"system-link\" href=\"#offline-showcase\" data-i18n=\"showcase\">完整展示\u003c/a>\u003ca class=\"system-link\" href=\"#offline-components\" data-i18n=\"designSystem\">查看设计系统\u003c/a>\u003cspan>Inspired by Apple. Crafted for the web.\u003c/span>\u003cspan>\u003cspan data-i18n=\"footer\">可交互组件 · 实时光学模拟\u003c/span>\u003c/span>\u003c/footer>\r\n  \u003c/main>\r\n  \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\r\n  \u003cscript type=\"module\">\nconst freezeTokens=value=>{for(const item of Object.values(value))if(item&&typeof item==='object')freezeTokens(item);return Object.freeze(value);};\nconst tokens=freezeTokens({\n  version:'1.1.0-showcase.1',\n  color:{text:'#22252b',muted:'#6b7079',accent:'#2875ed',focus:'#2576e8',page:'#f7f8fa',success:'#236442'},\n  type:{family:'-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif',body:16,control:14,caption:12},\n  space:{xs:4,sm:8,md:16,lg:24,xl:32},\n  radius:{chrome:14,panel:34,lens:60,pill:999},\n  surface:{fallback:'rgba(245,250,255,.30)',solid:'#eef2f8',shadow:'inset 0 1px 0 #fff9,inset 1px 0 0 #fff3,0 12px 24px -12px #2135524d'},\n  motion:{elasticity:.70,spring:'cubic-bezier(.2,.9,.25,1.22)',fast:160,normal:240,feedback:520},\n  optics:{gold:'#e2b54e',green:'#52bb83',light:'#90e8fa',flowDuration:1100,settleDuration:280,magnification:1.8},\n  audio:{enabled:true,volume:.28,maxVoices:6,cooldown:70,storageKey:'lens.sound.v1'},\n  materials:{clear:{refraction:.65,blur:.12,dispersion:.35},soft:{refraction:.38,blur:.64,dispersion:.12},thick:{refra .scene,motion:state.motion,opaque:state.opaque,compare:state.compare};\n  const text=JSON.stringify(configuration,null,2);\n  try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);notify('copied');}\n  catch{const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='lens-material.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('downloaded');}\n  $('#copy-button use').setAttribute('href','#i-check');feedback($('#copy-button .icon'));setTimeout(()=>$('#copy-button use').setAttribute('href','#i-code'),1800);\n  sound.play('success');\n});\n\nconst soundBindings={\n  toggle:'#wifi,#bluetooth,#focus-switch,#motion,#opaque,#scene-motion,#sound-enabled',\n  select:'button[data-preset],button[data-scene],button[data-view],button[data-dock],button[data-language],#more-button,#menu-lens,#compare-button',\n  favorite:'#favorite,#gallery-like',tick:'input[type=range],#duration-minus,#duration-plus',\n  success:'#gallery-action',dismiss:'#notification-close',restore:'#restore-notification',reset:'#reset,#gallery-reset,#menu-reset',type:'#gallery-search',\n};\nfor(const [cue,selector] of Object.entries(soundBindings))$$(selector).forEach(element=>element.dataset.lgSound=cue);\nlens.dataset.lgSoundKey='tick';\n$('#sound-enabled').addEventListener('change',event=>sound.set({enabled:event.target.checked}));\n$('#sound-volume').addEventListener('input',event=>sound.set({volume:Number(event.target.value)/100}));\nconst unbindSounds=bindControlSounds(document,sound);\nsyncMaterial();refreshLanguage();\nwindow.addEventListener('pagehide',event=>{sound.stop();if(!event.persisted){labOptics.destroy();unbindSounds();unbindFocus();sound.destroy();focusControl.destroy();choiceControl.destroy();jelly.destroy();renderer?.destroy();}});\nwindow.addEventListener('pageshow',event=>{if(event.persisted)renderer?.invalidate();});\nObject.defineProperty(window,'glassDiagnostics',{get:()=>({renderer:renderer&&!renderer.lost&&!renderer.suspended?'webgl2':'css',settings:{...state},surfaces:renderer?.geometry.length||0,canvas:{width:$('#glass-canvas').width,height:$('#glass-canvas').height},glError:renderer?.gl?.getError()??null})});\n\n\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","api":"# Lens Design System\n\n一套可复制、可扩展的原生 Web 设计系统。默认「厚润 / Thick」，包含真实背景折射、弹性手势、18 类语义化控件和 13 种原创合成交互音效。运行时无依赖、无 CDN、无音频下载。\n\n所有固定名称和展示入口见 [组件清单](COMPONENTS.md)，页面入口为 `examples/optics.html#component-index`。`componentCatalog` 从公共入口导出中英文名称、工厂标识和示例参数；新增组件时同步这份清单。\n\n系统范围与复用规则见 [SCOPE.md](SCOPE.md)，核心术语见 [CONTEXT.md](CONTEXT.md)：所有视觉内容拆解为背景、图标（文字）、透镜、凹槽、发光效果、液体、反光变体；所有交互由复用的透镜组件承载，材质反馈通过光、反光和液体表达。公共组件名称描述用途，不是七类之外的新元素。该规则是后续准入与对齐标准，当前实现差距已在 SCOPE 单列。\n\n当前版本 `1.1.0-showcase.1` 在 `1.0.0` 之上新增的内容及 API 见 [光学交互说明](INTERACTIONS.md) 和 [完整展示页说明](SHOWCASE.md)。\n\nA portable native-web system for glass materials, elastic interaction and quiet sound. Semantic HTML remains responsible for input, focus and accessible state. No runtime dependencies.\n\n## Run / 运行\n\n从随附 `lab` 项目执行 `npm start`，打开 `http://127.0.0.1:4173/design-system/index.html`。目录可切换中文 / EN；独立集成示例在 `examples/basic.html`，完整展示页在 `examples/optics.html`，包含材质、控件、声音、光学交互、图表和表格。\n\n也可把整个 `design-system/` 文件夹复制到任何静态网站。通过 HTTP 提供 ES modules；直接双击模块页面会受到浏览器的 `file:` 导入限制。材质实验室和完整展示页各附中英文单文件 HTML，构建时内联全部运行代码。\n\n## Install / 接入\n\n```html\n\u003clink rel=\"stylesheet\" href=\"./design-system/tokens.css\">\n\u003clink rel=\"stylesheet\" href=\"./design-system/components.css\">\n\u003cdiv id=\"stage\" style=\"min-height:280px;padding:32px\">\u003c/div>\n\u003cscript type=\"module\">\n  import {createComponent, createGlassSystem} from './design-system/index.js';\n  const stage = document.querySelector('#stage');\n  const focus = createComponent('switch', {\n    label: 'Focus', checked: false,\n    onChange: checked => console.log(checked)\n  });\n  stage.append(focus.element);\n  const system = createGlassSystem(stage); // Thick, quiet sound, no idle movement\n  // On application unmount:\n  // system.destroy(); focus.destroy();\n\u003c/script>\n```\n\n也可用 `npm install ./design-system` 作为本地 ESM 包安装，导入 `@lens/design-system` 及其两个 CSS 入口。包自带 `index.d.ts`，类型化示例见 `examples/typed.ts`；没有 React、Vue 或构建工具绑定。框架组件在 effect / mounted 中创建，在 cleanup / unmounted 中销毁。\n\n## Layers / 组织\n\n| 文件 | 职责 |\n| --- | --- |\n| `tokens.js` | 不可变的颜色、字号、间距、圆角、材质、动效和音量规则，唯一变量来源 |\n| `tokens.css`, `tokens.json` | 由 `node build-tokens.mjs` 生成，供样式和其他工具使用 |\n| `components.css` | `lg-` 命名空间的材质、控件、选择、禁用、焦点和兼容状态 |\n| `components.js` | 组件工厂与可增强既有 HTML 的开关、胶囊行为 |\n| `card-list.js` | 横向透镜卡片列表、原生滚动、吸附、导航与子组件生命周期 |\n| `component-patterns.js` | 图标按钮、连接开关、分段标签、浮动导航和操作菜单 |\n| `component-catalog.js` | 统一中英文名称、固定标识、展示页索引和使用示例 |\n| `sound.js` | 原创 PCM 合成、共享音频上下文、节流、音量、静音和偏好存储 |\n| `showcase.js`, `showcase.css`, `showcase-charts.js` | 完整展示页面与示例数据图表；可独立挂载、读取图表状态和卸载 |\n| `internal/chart-glass.js` | 图表的彩色玻璃、液面、光源与真实刻度折射；DOM / SVG 保留语义与兼容显示 |\n| `runtime.js` | WebGL、弹性和声音的统一挂载与销毁 |\n| `internal/` | 渲染与手势实现；优先通过公共入口使用 |\n| `index.html`, `examples/` | 实际运行上述组件的双语目录与最小接入示例 |\n\n材质实验室也使用这一目录的渲染器、物理控制器、变量、声音、开关和胶囊行为。项目根部的 `glass.js`、`jelly.js`、`jelly-physics.js` 只是旧导入路径的兼容入口。页面特有的布局仍留在实验室 `style.css`。\n\n## Components / 控件\n\n调用 `createComponent(name, props)` 得到 `{element, destroy, ...}`。先把 `element` 插入 stage，再创建系统；后来增加的组件用 `system.mount(element)` 注册。可见文案和无障碍名称可以由调用者本地化，不能把标签作为业务值。组件的 `setValue()` 默认不触发业务回调；新光学控件在 `{emit:true}` 提交选择或完成进度时也发出对应的语义音效事件，由所在系统的音效设置决定是否播放。\n\n| 名称 | 主要属性 | 返回值 / 行为 |\n| --- | --- | --- |\n| `button` | `label`, `variant`, `disabled`, `sound`, `onPress` | `setDisabled()`；原生按钮、按住拖动、语义音效 |\n| `icon-button` | `label`, `icon`, `pressed`, `disabled`, `onChange`, `onPress` | `value`, `setValue()`, `setDisabled()`；传入 `pressed` 时可切换，保留可访问名称 |\n| `toggle-tile` | `label`, `icon`, `checked`, `onLabel`, `offLabel`, `disabled`, `onChange` | `value`, `setValue()`, `setDisabled()`；连接状态、绿色反光、switch 语义 |\n| `tabs` | `label`, `options:[{value,label,content,disabled}]`, `value`, `onChange` | `value`, `setValue()`；标签 / 面板关联、拖动玻璃选中层、方向键、Home / End |\n| `dock` | `label`, `options:[{value,label,icon,disabled}]`, `value`, `onChange` | `value`, `setValue()`；图标导航、拖动选中层、键盘、`aria-current` |\n| `menu` | `label`, `options:[{value,label,icon,disabled}]`, `onAction` | `open()`, `close()`；展开 / 收起动画，方向键跳过禁用项，Escape 回到触发器 |\n| `switch` | `label`, `checked`, `onChange` | `value`, `setValue()`；点击、拖动、空格、左右与 Home/End |\n| `choices` | `label`, `options:[{value,label,disabled}]`, `value`, `selectionColor`, `onChange` | `value`, `setValue()`；互斥选择、方向键、勾选、选中边缘变色与一次流光 |\n| `slider` | `label`, `min`, `max`, `step`, `value`, `onChange` | `value`, `setValue()`；原生 range 语义和玻璃滑钮 |\n| `stepper` | `label`, `min`, `max`, `step`, `value`, `unit`, `decreaseLabel`, `increaseLabel`, `onChange` | `value`, `setValue()`；边界按钮禁用，live output |\n| `notification` | `title`, `description`, `dismissLabel`, `onDismiss` | `show()`；调用者在关闭 / 恢复后管理焦点 |\n| `search` | `label`, `placeholder`, `onChange` | `value`, `setValue()`；原生 search，忽略输入法组合过程的声音 |\n| `lens` | `label`, `caption` | 自由拖动、方向键、Home 居中；容器需有明确高度 |\n| `panel` | `label`, `children:Node[]`, `motion:'tether'|'press'|'none'` | 组合插槽；默认拖动回弹，或仅按压／保持静态；不抢夺内部控件的操作 |\n| `card-list` | `label`, `items:[{id,label,title?,description?,icon?,children?}]`, `previousLabel`, `nextLabel`, `emptyLabel`, `autoScroll`, `pauseLabel`, `playLabel` | `scrollTo(id,{behavior})`, `pause()`, `play()`, `playing`；横向原生滚动与吸附、可选自动循环、导航与子组件生命周期 |\n| `progress` | `label`, `value`, `max`, `completionColor`, `wave`, `motion`, `onComplete` | `setValue()`, `setMotion()`, `setCompletionColor()`；已完成区域折射与光纤波动，完成时流光渐变为绿色或金色 |\n| `drop-select` | `label`, `options:[{value,label,icon,disabled}]`, `variant`, `selectionColor`, `onChange` | `setValue()`, `setVariant()`, `setDisabled()`；松手吸附最近可用凹槽；玻璃到达后连续汇入，落点由凹变凸；点击、键盘与取消也沿当前姿态运动 |\n| `xy-slider` | `label`, `xLabel`, `yLabel`, `value:{x,y}`, `variant`, `magnification`, `onChange`, `onCommit` | `setValue()`, `setVariant()`, `setDisabled()`；二维调节、普通触点 / 放大透镜，两轴原生 range 备选 |\n\n用 `bindSwitch(existingButton, options)` 或 `bindChoiceGroup(existingGroup, options)` 增强已有语义 DOM。胶囊按钮使用 `data-choice=\"stable-id\"`。实例销毁时先 `system.destroy()` 再销毁每个组件 handle；`mount()` 可重复调用而不会重复注册现有手势。\n\n### Card list / 透镜卡片列表\n\n`card-list` 组合现有面板、按钮、滑杆和进度组件。所有卡片默认使用 16:9 横版比例。每项 `id` 与 `label` 必须非空且 `id` 唯一；`title` 默认使用 `label`，传 `title:''` 可隐藏可见标题而保留卡片的无障碍名称。`icon` 接受调用者创建的扁平图标节点。`children` 可混合组件 handle、DOM 节点和文字：列表接管传入 handle 的销毁责任，原始 DOM 节点仍由调用者管理；同一个节点或 handle 不能放入多个卡片。\n\n```html\n\u003clink rel=\"stylesheet\" href=\"./design-system/tokens.css\">\n\u003clink rel=\"stylesheet\" href=\"./design-system/components.css\">\n\u003cdiv id=\"cards\" style=\"min-height:380px;padding:24px\">\u003c/div>\n\u003cscript type=\"module\">\n  import {createComponent, createGlassSystem} from './design-system/index.js';\n\n  const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n  icon.setAttribute('viewBox', '0 0 48 48');\n  const tile = document.createElementNS(icon.namespaceURI, 'rect');\n  for (const [key, value] of Object.entries({x:4, y:4, width:40, height:40, rx:10, fill:'#72c9b5'})) tile.setAttribute(key, value);\n  const mark = document.createElementNS(icon.namespaceURI, 'path');\n  for (const [key, value] of Object.entries({d:'M15 16h18v4H15zm0 7h14v4H15zm0 7h18v4H15z', fill:'#173f39'})) mark.setAttribute(key, value);\n  icon.append(tile, mark);\n  const brightness = createComponent('slider', {\n    label: 'Brightness', value: 64, onChange: console.log\n  });\n  const progress = createComponent('progress', {\n    label: 'Focus progress', value: 42, completionColor: 'gold'\n  });\n  const save = createComponent('button', {\n    label: 'Save', sound: 'success', onPress: () => console.log('Saved')\n  });\n  const cards = createComponent('card-list', {\n    label: 'Focus tools',\n    previousLabel: 'Previous tools',\n    nextLabel: 'Next tools',\n    autoScroll: true,\n    pauseLabel: 'Pause cards',\n    playLabel: 'Play cards',\n    items: [\n      {id: 'adjust', label: 'Adjust brightness', icon, children: [brightness]},\n      {id: 'session', label: 'Focus session', description: 'Keep the current rhythm.', children: [progress, save]}\n    ]\n  });\n  const stage = document.querySelector('#cards');\n  stage.append(cards.element);\n  const system = createGlassSystem(stage);\n\n  // true uses 24 px/s; a positive number selects another px/s speed.\n  // cards.pause(); cards.play(); console.log(cards.playing);\n  // cards.scrollTo('session', {behavior: 'smooth'});\n  // On unmount, destroy the system first. cards.destroy() also destroys\n  // brightness, progress and save because their handles were transferred.\n  // system.destroy(); cards.destroy();\n\u003c/script>\n```\n\n触控板、触摸和滚轮使用原生横向滚动与 scroll snap；鼠标或笔可以从卡片空白处拖动，触摸继续使用原生 pan。列表获得焦点时，方向键和 Home / End 移动卡片，嵌套控件处理自己的键盘和指针手势而不会带动列表。前后按钮使用相同导航。\n\n`autoScroll` 默认为 `false`；`true` 使用每秒 24 CSS 像素，正数指定每秒像素速度。只有内容足够溢出、可让至少一张卡片完整离开视口时才启用无缝循环；少量内容保留普通手动滚动。循环移动原有卡片 DOM 与 handle，不创建克隆。播放／暂停控件复用公共 `button` 透镜。\n\n`playing` 表示该列表当前的用户播放意愿。普通环境中，鼠标悬停、列表内键盘焦点、拖动、其他手动操作、页面隐藏或列表离屏只会暂时停止实际移动，不改变 `playing`；`pause()` 将其设为 `false`，`play()` 将其设为 `true`。如果列表初始化时系统已启用减弱动态，播放意愿从 `false` 开始，自动滚动保持静止，但播放按钮仍然可见；用户点击播放或调用 `play()` 可只为该列表主动开启动效。系统偏好之后每次切换为减弱动态都会再次暂停并清除这次主动选择。减弱动态下拖拽惯性始终关闭，编程滚动也强制使用 `auto`，即使调用者请求 `smooth`。`scrollTo()` 找不到 ID 或实例已销毁时返回 `false`。\n\n## Keyboard focus / 键盘焦点\n\n`createGlassSystem()` 自动为 stage 管理焦点框。Tab、方向键或其他非修饰键操作后显示；鼠标 / 触控板移动、按下、滚轮或双指滚动，以及触摸操作立即隐藏。再次使用键盘时恢复。只改变焦点提示样式，不调用 `blur()`，因此输入光标、选中值和当前 DOM 焦点都会保留。\n\n要覆盖页面中 stage 之外的工具栏与链接，可显式绑定页面；同一文档共用事件监听，支持多个组件系统独立卸载：\n\n```js\nimport {bindKeyboardFocus} from './design-system/index.js';\nconst unbindFocus = bindKeyboardFocus(document);\n// On page/app unmount:\nunbindFocus();\n```\n\n`data-lg-input=\"keyboard|pointer\"` 由该服务维护。自定义控件可沿用这个状态显示自己的焦点代理元素；不要把实际选中态绑定到它。\n\n## Material and theme / 材质与主题\n\n```js\nsystem.setMaterial('clear');\nsystem.setMaterial({refraction: .78, blur: .18, dispersion: .32});\nsystem.setScene('grid'); // aurora | sunset | ocean | grid\nsystem.jelly.setIntensity(.55);\n```\n\n材质参数为 0–1，缺省值来自 Thick，越界有限数值会夹到合法范围，NaN 和未知预设会报错。\n\n应用也可以提供自己的画布背景。回调绘制的像素会上传到场景纹理，玻璃会真实采样、折射这张背景；它不是叠在玻璃上方的装饰层。`width` 和 `height` 是纹理画布的像素尺寸，`dpr` 可用于把尺寸换算为 CSS 像素。回调会在首次创建、尺寸变化、WebGL 上下文恢复以及 `setScene()` 切换（或刷新同名场景）时再次调用。提供回调后不会绘制内置场景或 `hello.`；不提供时原有场景保持不变。\n\n```js\nconst system = createGlassSystem(stage, {\n  scene: 'aurora',\n  artwork(ctx, {width, height, dpr, scene}) {\n    ctx.fillStyle = scene === 'ocean' ? '#173c55' : '#d9e8df';\n    ctx.fillRect(0, 0, width, height);\n    ctx.fillStyle = '#24445c';\n    ctx.font = `${24 * dpr}px sans-serif`;\n    ctx.fillText('Custom sampled background', 24 * dpr, 48 * dpr);\n  }\n});\n\n// Redraw after application state used by the callback changes.\nsystem.setScene('aurora');\n```\n\n```css\n.my-surface {\n  --lg-radius-panel: 28px;\n  --lg-color-focus: #235b85;\n  --lg-font-control: 15px;\n}\n```\n\nCSS 变量用于类型、布局、控件和 CSS 兼容材质。WebGL 中的折射 / 雾化 / 色散由 `setMaterial()` 设置；不要以为只改 CSS 背景色就会改变 GPU 光学。\n\n## Sound / 音效\n\n默认音量 28%，不自动播放，不响应 hover，不循环背景音。声音只补充视觉反馈。首次操作时才创建 AudioContext；浏览器不支持或拒绝音频时，控件继续工作。音效偏好使用 `lens.sound.v1`，受限存储会自动退回内存。传 `audio:{storage:null}` 可关闭偏好持久化。\n\n```js\nsystem.sound.set({enabled:false});       // 立即停止已播放与等待中的声音\nsystem.sound.set({enabled:true, volume:.35});\nawait system.sound.play('success');      // 从用户操作回调中调用\n```\n\n透镜的纸面摩擦音复用同一个音量和静音设置。自由透镜、拖放透明胶囊、二维透镜在按下后解锁声音，移动速度控制音量、滤波与采样速度；停住 90ms 后淡出，松手 / 取消 / Escape / 失焦 / 隐藏 / 卸载时结束。普通二维触点不触发该音效。自定义图表透镜用 `data-lg-friction` 显式加入相同的拖动声音委托，悬停仍保持安静。这是声音能力的共享，不代表这些控件已统一复用透镜组件。\n\n自定义手势可在用户按下回调中调用 `await sound.startFriction()`，移动时调用 `sound.updateFriction(speed)`（CSS 像素 / 秒），结束时调用 `sound.endFriction()`；`endFriction(true)` 立即释放音源。`synthesizeFriction(sampleRate)` 导出原创纸面噪声 PCM。摩擦声是手势期间的循环音源，不属于 13 种短提示音；页面启动或鼠标悬停不播放。\n\n| 语义 | Cue |\n| --- | --- |\n| 抓起 / 松手 | `grab` / `release` |\n| 开启 / 关闭 | `switchOn` / `switchOff` |\n| 选择 / 调节 / 输入 | `select` / `tick` / `type` |\n| 确认 / 收藏 | `success` / `favorite` |\n| 收起 / 恢复 / 重置 | `dismiss` / `restore` / `reset` |\n| 自定义轻按场景 | `press` |\n\n`bindControlSounds(root, sound)` 为已有 HTML 提供委托绑定：按钮 `data-lg-sound=\"success\"`，开关 `data-lg-sound=\"toggle\"`，range 用 `tick`，输入框用 `type`。`lg:gesture` 由 JellyController 发出；移动超过阈值才触发抓起，取消手势不会播放完成音。默认每 cue 最少间隔 70ms，滑杆 90ms、输入 100ms；最多 6 个声音并发。过期 220ms 的待播放事件丢弃，静音 / 卸载不会延迟补播。\n\n## Extend / 扩展\n\n新控件先遵守 [元素归属与透镜复用规则](SCOPE.md)，优先组合已有组件并返回同样的 handle；仅有相同 handle 或玻璃外观不足以通过准入。不得覆盖内置名字：\n\n```js\nimport {defineComponent, createComponent} from './design-system/index.js';\ndefineComponent('approve', ({label, onPress}) =>\n  createComponent('button', {label, variant:'success', sound:'success', onPress})\n);\nconst approve = createComponent('approve', {label:'Approve', onPress: save});\n```\n\n声音定义使用秒、Hz 和 0–1 振幅；单个 cue 最长 1 秒，避免长音阻碍界面：\n\n```js\nsystem.sound.register('complete', {\n  duration:.22,\n  tones:[[520,520,.15],[780,780,.08,.07]]\n});\n// 在用户确认操作里：\nsystem.sound.play('complete');\n```\n\n现有高级材质接入支持 `.lg-surface`、`data-glass=\"panel|button|chip|small|notification|free\"` 和 `data-lg-drag=\"tether|free\"`；特殊 range / toggle / segment 可用导出的 `JellyController.register()`。这些兼容入口继续保留，但属于底层能力，不能单凭这些标记认定已复用透镜组件。新交互应组合已有控件，缺少能力时集中扩展共享透镜基础，不在使用方复制材质或手势实现；当前自由 `lens` 工厂尚不是通用透镜基础 API。使用 `textContent` 或 DOM 节点传入内容，组件不解析用户 HTML。\n\n## Limits / 边界与验证\n\n折射采样系统画布内的背景与已绘制玻璃，不自动捕获任意 DOM、iframe 或视频。玻璃背后的文字依然使用真实 DOM 保证可读和可访问。WebGL2 不可用时退回 CSS 毛玻璃。系统尊重 `prefers-reduced-motion`，背景默认不自动移动。语义色和重要文字需要在最终项目的背景上复查对比度。\n\n项目中执行 `npm test`、`npm run build`、`npm run check`。测试覆盖真实声音 PCM、懒加载、节流、并发限制、静音取消、存储、扩展注册、包内导入闭合，以及既有弹簧与双语规则。组件目录用于真实键盘 / 指针与移动端检查。不要用“没有 JS 报错”代替可视和交互检查。\n"}</script><script>
(() => {
  const assets=JSON.parse(document.getElementById('offline-assets').textContent);
  const showcase=document.getElementById('showcase');
  const view=document.createElement('section');view.id='offline-view';view.hidden=true;
  document.body.append(view);
  let priorHash='',priorScroll=0,priorFocus=null,opened=false,attachmentRoute=location.hash;
  const attachment=location.protocol==='content:';
  const route=()=>attachment?attachmentRoute:location.hash;
  const isOffline=()=>['#offline-api','#offline-lab'].includes(route());
  function close(target){
    if(attachment)attachmentRoute=target||priorHash||'#material';
    else history.replaceState(null,'',target||priorHash||'#material');
    render();
    if(target)document.querySelector(target)?.scrollIntoView();
  }
  function render(){
    if(!isOffline()){
      if(opened){
        view.replaceChildren();view.hidden=true;showcase.hidden=false;opened=false;
        window.scrollTo(0,priorScroll);priorFocus?.focus({preventScroll:true});
      }
      return;
    }
    const en=document.documentElement.lang==='en';
    if(!opened){priorScroll=window.scrollY;priorFocus=document.activeElement;opened=true;}
    showcase.hidden=true;view.hidden=false;view.replaceChildren();
    const header=document.createElement('header');header.className='offline-header';
    const back=document.createElement('button');back.className='offline-back';back.type='button';
    back.textContent=en?'Back to showcase':'返回展示';back.addEventListener('click',()=>close());
    const title=document.createElement('h1');title.id='offline-title';
    title.textContent=route()==='#offline-api'?(en?'Component API':'组件 API'):(en?'Material lab':'材质实验室');
    view.setAttribute('aria-labelledby',title.id);header.append(back,title);view.append(header);
    if(route()==='#offline-api'){
      const text=document.createElement('pre');text.className='offline-api';text.textContent=assets.api;view.append(text);
    }else{
      const frame=document.createElement('iframe');frame.className='offline-lab';frame.title=title.textContent;
      frame.addEventListener('load',()=>{
        frame.contentDocument.addEventListener('click',event=>{
          const anchor=event.target.closest('a');if(!anchor)return;
          const href=anchor.getAttribute('href');
          if(href==='#offline-components'||href==='#offline-showcase'){
            event.preventDefault();close(href==='#offline-components'?'#component-index':'#material');
          }
        });
      });
      frame.srcdoc=assets.lab.replace('data-default-language="zh"','data-default-language="'+(en?'en':'zh')+'"');
      view.append(frame);
    }
    window.scrollTo(0,0);back.focus({preventScroll:true});
  }
  document.addEventListener('click',event=>{
    const anchor=event.target.closest('a');
    const href=anchor?.getAttribute('href');
    if(['#offline-api','#offline-lab'].includes(href)&&!opened)priorHash=route();
    // Android content providers can reject a URI when its fragment changes.
    // Keep attachment navigation in this document without rewriting its grant.
    if(attachment&&href?.startsWith('#')){
      event.preventDefault();attachmentRoute=href;render();
      if(!isOffline()&&href.length>1)document.getElementById(href.slice(1))?.scrollIntoView();
    }
  });
  window.addEventListener('hashchange',render);
  // The incumbent module mounts first; also supports bookmarked offline views.
  window.addEventListener('DOMContentLoaded',render,{once:true});
})();
</script></body>
</html>
