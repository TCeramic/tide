<!doctype html><html lang="zh-CN" data-mobile="true" data-shell="lens" data-color-mode="dark" data-view="home" data-render-active="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.music.126.net https://*.126.net; font-src 'self' data:; connect-src 'none'; worker-src 'none'"><link rel="stylesheet" href="native-fonts.css"><link rel="stylesheet" href="native-systems.css"><link rel="stylesheet" href="mobile.css"><title>潮汐 Tide</title></head><body><div id="app"><header class="topbar"><button id="home-button" aria-label="主页"></button><form id="search-form"><input id="search-input" type="search" placeholder="搜索音乐、歌手或专辑" aria-label="搜索"></form><button id="settings-button" aria-label="设置"></button><button id="account-button" aria-label="账号"></button></header><main class="mobile-scroll"><section id="home-page"><div class="brand-space" aria-hidden="true"></div><div class="home-grid"><button class="home-card continue-card" id="continue-card"><div class="home-cover"><img id="home-art" src="assets/today-tide.png" alt="当前歌曲封面"></div><div class="continue-copy"><h2 id="home-title">继续播放</h2><p id="home-subtitle">选择喜欢的音乐，开始今天的潮汐</p></div></button><button class="home-card" id="cloud-card"><span class="tile-icon" data-icon="library"></span><h2>我的歌单</h2><p id="cloud-subtitle">登录网易云，找回熟悉的音乐</p></button><button class="home-card" id="daily-card"><span class="tile-icon" data-icon="waves"></span><h2>今日潮汐</h2><p id="favorite-count">随音乐一起探索</p></button><button class="home-card" id="local-card"><span class="tile-icon" data-icon="music"></span><h2>本地音乐</h2><p id="local-count">导入设备中的音乐</p></button><button class="home-card" id="proof-card"><span class="tile-icon" data-icon="tree"></span><h2>音乐脉络</h2><p>歌手 → 专辑 → 单曲</p></button></div></section><section id="player-page" hidden><header class="player-nav"><button id="player-back" aria-label="返回">‹</button><span class="mobile-emblem-slot" aria-hidden="true"></span><div class="player-menu-anchor"><button id="player-more" aria-label="播放设置" aria-expanded="false">•••</button><div id="player-menu" class="dropdown-menu" hidden><div id="language-options" role="group" aria-label="歌词语言"><button data-language="both">双语</button><button data-language="original">原文</button><button data-language="translation">翻译</button><button data-language="romaji">罗马音</button></div><button id="current-song-options">歌曲操作</button></div></div></header><button class="lyrics-cover" id="player-cover"><img id="player-art" src="assets/today-tide.png" alt="专辑封面"></button><div class="player-heading"><div><h1 id="player-title">潮汐 Tide</h1><p id="player-artist"></p></div><button id="player-like" aria-label="喜欢"></button></div><div id="lyric-view" hidden><div id="all-lyrics" class="all-lyrics" tabindex="0" aria-label="全部歌词"></div><div id="lyric-guide" hidden aria-hidden="true"></div><div id="lyric-confirm" hidden><span id="lyric-target"></span><button id="lyric-seek" class="action-button">确认跳转</button><button id="lyric-cancel" class="action-button">取消</button></div></div><p id="player-status" role="status"></p><div class="mobile-progress"><input id="song-progress" type="range" min="0" max="1000" value="0" aria-label="歌曲进度"><div><span id="song-time">0:00</span><span id="song-duration">0:00</span></div></div><div class="player-controls"><button id="repeat-button" aria-label="循环方式"></button><button id="previous-button" aria-label="上一首"></button><button id="play-button" class="primary-play" aria-label="播放或暂停"></button><button id="next-button" aria-label="下一首"></button><button id="queue-button" aria-label="播放队列"></button></div></section><section id="proof-page" class="proof-host" hidden></section><section id="content-page" class="browse-sheet" hidden></section></main><footer class="transport"><button id="dock-like" aria-label="喜欢"></button><button class="dock-song" id="dock-song"><img id="dock-art" src="assets/today-tide.png" alt="封面"><span><strong id="dock-title">潮汐 Tide</strong><small id="dock-subtitle">选择一首音乐</small></span></button><button id="dock-previous" aria-label="上一首"></button><button id="dock-play" aria-label="播放或暂停"></button><button id="dock-next" aria-label="下一首"></button></footer><dialog id="queue-sheet" class="bottom-sheet"><div class="dialog-header"><h2>当前播放列表</h2><button id="close-queue" aria-label="关闭队列">×</button></div><div id="queue-items"></div></dialog><dialog id="create-playlist-dialog"><form id="create-playlist-form"><div class="dialog-header"><h2>创建歌单</h2><button type="button" id="close-create" aria-label="取消创建">×</button></div><input id="playlist-name" maxlength="40" required placeholder="歌单名称" aria-label="歌单名称"><label><input id="playlist-private" type="checkbox">私密歌单</label><button id="create-playlist-submit" class="action-button">创建</button><p id="create-playlist-status" role="status"></p></form></dialog><div id="mobile-toast" role="status" hidden></div><dialog id="login-dialog"><div class="dialog-header"><h2>登录网易云</h2><button id="close-login" aria-label="关闭登录"></button></div><p class="muted">扫码授权或使用手机号验证码登录</p><div id="account-profile" hidden><img id="login-avatar" alt="账号头像"><strong id="login-nickname"></strong><button id="switch-account" class="action-button">切换账号</button><button id="logout-account" class="action-button">退出登录</button></div><div id="login-methods"><div id="qr-area"><div id="qr-code"></div><p id="qr-status">点击下方生成二维码</p><button id="qr-start" class="action-button">生成登录二维码</button></div><details><summary>手机号验证码登录</summary><input id="login-phone" type="tel" autocomplete="tel" placeholder="手机号" aria-label="手机号"><div class="captcha-row"><input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="验证码" aria-label="验证码"><button id="send-captcha" class="action-button">发送验证码</button></div><button id="sms-login" class="action-button">登录</button></details></div><p id="login-note" role="status"></p></dialog></div><script src="mobile.js"></script></body></html>
